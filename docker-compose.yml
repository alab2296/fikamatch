services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fika
      POSTGRES_PASSWORD: fika
      POSTGRES_DB: fikamatch
    ports: ["${DB_PORT:-5433}:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["${REDIS_PORT:-6380}:6379"]
volumes:
  dbdata:
